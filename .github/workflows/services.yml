name: services

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install paxiom dependencies
        run: npm ci

      # wasm checksum verify: removed until bls_verifier.wasm is actually
      # vendored. Re-add this step alongside the real .wasm + .sha256 once
      # bls-verifier ships its first release. Tracked by audit/L-20.

      - name: Sync committee service tests (mock dispatch)
        run: npm run test:sync-committee

      - name: Load network reconstruction tests (fixture)
        run: npm run test:load-network

      - name: SDK signal-HMAC tests (live-executor /signal auth)
        run: npm run test:sdk
